name: Tests

on:
  # Trigger on any push (this repo is a fork, where the pull_request event does
  # not fire reliably; the hassfest workflow uses the same bare-push pattern).
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # Home Assistant 2026.x requires Python 3.13
      - name: Install test dependencies (Home Assistant + octopus-kraken + pytest)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Run offline tests
        # Live tests need real credentials and are auto-skipped here.
        run: python -m pytest -m "not live" -v
